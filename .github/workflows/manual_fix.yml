name: Fix Specific Notice (Manual)

on:
  workflow_dispatch:
    inputs:
      doc_id:
        description: 'Firestore Document ID to fix'
        required: true
        type: string

jobs:
  fix_notice:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --no-cache-dir -r requirements.txt

    - name: Inject Firebase Secret Key JSON
      run: |
        cat << 'EOF' > serviceAccountKey.json
        ${{ secrets.FIREBASE_JSON_DATA }}
        EOF

    - name: Run Manual Fixer Engine
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TARGET_DOC_ID: ${{ github.event.inputs.doc_id }}
      run: python -u fix_notice.py
